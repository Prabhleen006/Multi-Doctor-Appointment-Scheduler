<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Reviews & Ratings | Multi-Doctor Appointment Conflict Scheduler</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <nav class="navbar"></nav>

  <main class="dashboard-container">
    <div class="dashboard-header">
      <div>
        <h1 class="welcome-title"><i class="fas fa-star" style="color: #f59e0b;"></i> Verified Patient Reviews</h1>
        <p class="welcome-subtitle">Transparent feedback submitted after doctor consultation completion.</p>
      </div>
    </div>

    <!-- Overall Ratings & Filter Summary Card -->
    <div class="card" style="margin-bottom: 2.5rem; padding: 2rem;">
      <div class="grid-3" style="align-items: center;">
        <div style="text-align: center; border-right: 1px solid var(--border-color); padding-right: 1.5rem;">
          <div style="font-size: 3rem; font-weight: 800; color: var(--text-main); line-height: 1;" id="overallAvgRating">4.8</div>
          <div style="color: #f59e0b; font-size: 1.2rem; margin: 0.3rem 0;">★ ★ ★ ★ ★</div>
          <p style="font-size: 0.85rem; color: var(--text-muted);" id="overallTotalReviews">Based on verified patient reviews</p>
        </div>

        <div style="grid-column: span 2; padding-left: 1rem;">
          <label for="reviewDoctorFilter" class="form-label">Filter Reviews by Physician</label>
          <select id="reviewDoctorFilter" class="form-control">
            <option value="All">All 10 Clinic Doctors & Specialties</option>
            <!-- Populated dynamically -->
          </select>
        </div>
      </div>
    </div>

    <!-- Doctor Reviews Cards Grid -->
    <div class="grid-2" id="reviewsGrid">
      <!-- Populated dynamically via DOM manipulation -->
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await populateDoctorFilter();
      await renderReviews();

      document.getElementById('reviewDoctorFilter').addEventListener('change', renderReviews);
    });

    async function populateDoctorFilter() {
      try {
        const res = await API.doctors.getAll();
        const doctors = res.data || [];
        const select = document.getElementById('reviewDoctorFilter');
        select.innerHTML = '<option value="All">All 10 Clinic Doctors & Specialties</option>' +
          doctors.map(d => `<option value="${d._id || d.id}">${d.name} (${d.specialty})</option>`).join('');
      } catch (err) {
        console.error('Failed to populate doctor filter:', err);
      }
    }

    async function renderReviews() {
      const selectedDocId = document.getElementById('reviewDoctorFilter').value;
      try {
        const res = await API.reviews.getAll(selectedDocId !== 'All' ? selectedDocId : '');
        let reviews = res.data || [];

        // Calculate Average Rating using reduce()
        const avgScore = reviews.length > 0
          ? (reviews.reduce((sum, r) => sum + r.rating, 0) / reviews.length).toFixed(1)
          : '0.0';

        document.getElementById('overallAvgRating').textContent = avgScore;
        document.getElementById('overallTotalReviews').textContent = `Based on ${reviews.length} verified patient review${reviews.length === 1 ? '' : 's'}`;

        const grid = document.getElementById('reviewsGrid');

        if (reviews.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: span 2;">
              <div class="empty-state card">
                <i class="fas fa-comment-slash empty-icon"></i>
                <p>No verified patient reviews recorded yet for the selected physician.</p>
              </div>
            </div>
          `;
          return;
        }

        grid.innerHTML = reviews.map(r => {
          const starsHtml = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
          const docName = r.doctorId?.name || r.doctorName || 'Doctor';
          const apptId = r.appointmentId?._id ? r.appointmentId._id.slice(-6).toUpperCase() : (r.appointmentId || 'VISIT');
          const dateStr = r.createdAt ? new Date(r.createdAt).toLocaleDateString() : 'Recent';

          return `
            <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.8rem;">
                  <div>
                    <h4 style="font-weight: 800; font-size: 1.05rem;">${docName}</h4>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Consultation #${apptId}</div>
                  </div>
                  <div class="star-display">${starsHtml}</div>
                </div>
                <p style="color: var(--text-main); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.25rem; font-style: italic;">
                  "${r.comment}"
                </p>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 0.8rem; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted);">
                <span><i class="fas fa-user-check" style="color: var(--teal);"></i> Verified Patient</span>
                <span><i class="fas fa-calendar"></i> ${dateStr}</span>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Failed to load reviews:', err);
      }
    }
  </script>
</body>
</html>
