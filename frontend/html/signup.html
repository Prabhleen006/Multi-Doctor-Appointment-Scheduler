<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration | Multi-Doctor Appointment Conflict Scheduler</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <nav class="navbar"></nav>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 500px;">
      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto 1rem;">
          <i class="fas fa-user-injured"></i>
        </div>
        <h1 class="auth-title">Create Patient Account</h1>
        <p class="auth-subtitle">Register to book appointments with clinic doctors</p>
      </div>

      <div class="alert-box alert-error" id="signupAlert">
        <i class="fas fa-exclamation-circle"></i> <span id="alertMessage"></span>
      </div>

      <form id="signupForm">
        <!-- Fixed Account Type Notice -->
        <div class="form-group">
          <label class="form-label">Account Type</label>
          <div style="background: var(--primary-light); border: 1.5px solid rgba(37, 99, 235, 0.3); padding: 0.65rem 1rem; border-radius: var(--radius-md); font-weight: 700; color: var(--primary-dark); display: flex; align-items: center; justify-content: space-between;">
            <span><i class="fas fa-circle-check" style="color: var(--primary);"></i> Patient Account</span>
            <small style="color: var(--text-muted); font-size: 0.75rem;">(Pre-selected)</small>
          </div>
          <small style="color: var(--text-muted); font-size: 0.78rem; display: block; margin-top: 0.3rem;">
            * Doctor accounts are predefined by the clinic administration system.
          </small>
        </div>

        <div class="form-group">
          <label for="signupName" class="form-label">Full Name *</label>
          <input type="text" id="signupName" class="form-control" placeholder="e.g. Sneha Kapadia" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="signupEmail" class="form-label">Email Address *</label>
            <input type="email" id="signupEmail" class="form-control" placeholder="sneha@example.com" required>
          </div>
          <div class="form-group">
            <label for="signupPhone" class="form-label">Phone Number *</label>
            <input type="tel" id="signupPhone" class="form-control" placeholder="9876543210" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="signupPassword" class="form-label">Password *</label>
            <input type="password" id="signupPassword" class="form-control" placeholder="At least 6 chars" required>
          </div>
          <div class="form-group">
            <label for="signupConfirmPassword" class="form-label">Confirm Password *</label>
            <input type="password" id="signupConfirmPassword" class="form-control" placeholder="Re-enter password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
          <i class="fas fa-user-check"></i> Create Patient Account
        </button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="login.html" style="font-weight: 700;">Login here</a>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const signupForm = document.getElementById('signupForm');
      const signupAlert = document.getElementById('signupAlert');
      const alertMessage = document.getElementById('alertMessage');

      signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        signupAlert.classList.remove('show');

        const submitBtn = signupForm.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

        const name = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const phone = document.getElementById('signupPhone').value.trim();
        const password = document.getElementById('signupPassword').value;
        const confirmPassword = document.getElementById('signupConfirmPassword').value;

        try {
          const result = await AuthModule.register({
            name,
            email,
            phone,
            password,
            confirmPassword
          });

          if (result.success) {
            AppController.showToast(result.message || 'Account created successfully! Redirecting to login...', 'success');
            setTimeout(() => {
              window.location.href = 'login.html?registered=true';
            }, 1000);
          } else {
            alertMessage.textContent = result.message;
            signupAlert.classList.add('show');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-user-check"></i> Create Patient Account';
          }
        } catch (err) {
          alertMessage.textContent = err.message || 'Registration failed. Server error.';
          signupAlert.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fas fa-user-check"></i> Create Patient Account';
        }
      });
    });
  </script>
</body>
</html>
