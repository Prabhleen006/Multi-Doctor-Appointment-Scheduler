<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments Directory | Multi-Doctor Appointment Conflict Scheduler</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <nav class="navbar"></nav>

  <main class="dashboard-container">
    <div class="dashboard-header">
      <div>
        <h1 class="welcome-title"><i class="fas fa-calendar-days" style="color: var(--primary);"></i> Appointment Management</h1>
        <p class="welcome-subtitle">Search, filter, and track all your scheduled consultations.</p>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="card" style="margin-bottom: 2rem; padding: 1.2rem 1.8rem;">
      <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
        <span style="font-weight: 700; font-size: 0.9rem; color: var(--text-muted);">
          <i class="fas fa-filter"></i> Filter Status:
        </span>
        <button class="btn btn-secondary btn-sm filter-badge-btn active" data-status="All">All</button>
        <button class="btn btn-secondary btn-sm filter-badge-btn" data-status="Pending">🟡 Pending</button>
        <button class="btn btn-secondary btn-sm filter-badge-btn" data-status="Approved">🟢 Approved</button>
        <button class="btn btn-secondary btn-sm filter-badge-btn" data-status="Completed">🔵 Completed</button>
        <button class="btn btn-secondary btn-sm filter-badge-btn" data-status="Rejected">🔴 Rejected</button>
        <button class="btn btn-secondary btn-sm filter-badge-btn" data-status="Cancelled">⚪ Cancelled</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Date & Time</th>
              <th>Patient</th>
              <th>Doctor & Specialty</th>
              <th>Room</th>
              <th>Reason</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="apptsDirectoryTbody">
            <!-- Populated dynamically via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentFilterStatus = 'All';

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await AuthModule.enforceGuard();
      if (!user) return;

      await renderAppointmentsTable(user);

      // Filter Buttons Event Delegation
      document.querySelectorAll('.filter-badge-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          document.querySelectorAll('.filter-badge-btn').forEach(b => b.classList.remove('active', 'btn-primary'));
          e.target.classList.add('active');
          currentFilterStatus = e.target.getAttribute('data-status');
          await renderAppointmentsTable(user);
        });
      });
    });

    async function renderAppointmentsTable(user) {
      const tbody = document.getElementById('apptsDirectoryTbody');
      tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 2rem;"><i class="fas fa-spinner fa-spin"></i> Loading appointments from database...</td></tr>`;

      try {
        const queryParams = currentFilterStatus !== 'All' ? { status: currentFilterStatus } : {};
        const res = await API.appointments.getMy(queryParams);
        const userAppts = res.data || [];

        if (userAppts.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7">
                <div class="empty-state">
                  <i class="fas fa-folder-open empty-icon"></i>
                  <p>No appointments match the selected status criteria.</p>
                </div>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = userAppts.map(a => {
          const patientName = a.patient ? a.patient.name : 'Patient';
          const patientEmail = a.patient ? a.patient.email : '';
          const doctorName = a.doctor ? a.doctor.name : 'Doctor';
          const specialty = a.doctor ? a.doctor.specialty : '';
          const roomNumber = a.room ? a.room.roomNumber : (a.roomNumber || 'Room');

          let cancelBtn = '';
          if (a.status === 'Pending' || a.status === 'Approved') {
            cancelBtn = `
              <button class="btn btn-outline btn-sm" onclick="cancelAppointment('${a._id}')" style="color: #ef4444; border-color: #fca5a5; padding: 0.2rem 0.6rem; font-size: 0.75rem; margin-top: 0.3rem;">
                <i class="fas fa-ban"></i> Cancel
              </button>
            `;
          }

          return `
            <tr>
              <td><code style="font-weight: 700; color: var(--primary);">#${a._id.slice(-6).toUpperCase()}</code></td>
              <td>
                <strong>${a.date}</strong>
                <div style="font-size: 0.8rem; color: var(--text-muted);">${SchedulerEngine.format12Hour(a.startTime)} - ${SchedulerEngine.format12Hour(a.endTime)}</div>
              </td>
              <td>
                <strong>${patientName}</strong>
                <div style="font-size: 0.78rem; color: var(--text-muted);">${patientEmail}</div>
              </td>
              <td>
                <strong>${doctorName}</strong>
                <div style="font-size: 0.78rem; color: var(--primary);">${specialty}</div>
              </td>
              <td><span style="font-size: 0.85rem; background: var(--bg-card-subtle); padding: 0.2rem 0.6rem; border-radius: 4px;">${roomNumber}</span></td>
              <td>
                ${a.reason}
                ${a.rejectionReason ? `<div style="font-size: 0.75rem; color: #ef4444; margin-top: 0.2rem;"><strong>Rejection note:</strong> ${a.rejectionReason}</div>` : ''}
              </td>
              <td>
                <span class="status-badge ${a.status}">${a.status}</span>
                ${cancelBtn}
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #ef4444; padding: 2rem;"><i class="fas fa-triangle-exclamation"></i> Failed to load appointments: ${err.message}</td></tr>`;
      }
    }

    async function cancelAppointment(appointmentId) {
      if (!confirm('Are you sure you want to cancel this appointment? Consultation room and physician slot will be released immediately.')) {
        return;
      }

      try {
        await API.appointments.cancel(appointmentId);
        AppController.showToast('Appointment successfully cancelled and resources released.', 'info');
        const user = AuthModule.checkSession();
        await renderAppointmentsTable(user);
      } catch (err) {
        AppController.showToast(err.message || 'Failed to cancel appointment.', 'error');
      }
    }
  </script>
</body>
</html>
