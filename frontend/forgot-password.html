<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Multi-Doctor Appointment Conflict Scheduler</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <nav class="navbar"></nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto 1rem;">
          <i class="fas fa-key"></i>
        </div>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Verify your email and set a new password</p>
      </div>

      <div class="alert-box" id="resetAlert">
        <span id="alertMessage"></span>
      </div>

      <form id="resetForm">
        <div class="form-group">
          <label for="resetEmail" class="form-label">Registered Email Address</label>
          <input type="email" id="resetEmail" class="form-control" placeholder="e.g. sneha@example.com" required>
        </div>

        <div class="form-group">
          <label for="newPassword" class="form-label">New Password</label>
          <input type="password" id="newPassword" class="form-control" placeholder="Minimum 6 characters" required>
        </div>

        <div class="form-group">
          <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" class="form-control" placeholder="Re-enter new password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
          <i class="fas fa-arrows-rotate"></i> Update Password
        </button>
      </form>

      <div class="auth-footer">
        Remembered your password? <a href="login.html" style="font-weight: 700;">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const resetForm = document.getElementById('resetForm');
      const resetAlert = document.getElementById('resetAlert');
      const alertMessage = document.getElementById('alertMessage');

      resetForm.addEventListener('submit', (e) => {
        e.preventDefault();
        resetAlert.className = 'alert-box';

        const email = document.getElementById('resetEmail').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmNewPassword').value;

        const result = AuthModule.resetPassword(email, newPassword, confirmPassword);

        if (result.success) {
          resetAlert.classList.add('alert-success', 'show');
          alertMessage.innerHTML = `<i class="fas fa-check-circle"></i> ${result.message}`;
          AppController.showToast(result.message, 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          resetAlert.classList.add('alert-error', 'show');
          alertMessage.innerHTML = `<i class="fas fa-circle-xmark"></i> ${result.message}`;
        }
      });
    });
  </script>
</body>
</html>
