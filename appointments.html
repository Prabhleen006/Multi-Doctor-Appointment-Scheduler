<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments Directory | Multi-Doctor Appointment Conflict Scheduler</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <nav class="navbar"></nav>

  <main class="dashboard-container">
    <div class="dashboard-header">
      <div>
        <h1 class="welcome-title"><i class="fas fa-calendar-days" style="color: var(--primary);"></i> Appointment Management</h1>
        <p class="welcome-subtitle">Search, filter, and track all your scheduled consultations.</p>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="card" style="margin-bottom: 2rem; padding: 1.2rem 1.8rem;">
      <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
        <span style="font-weight: 700; font-size: 0.9rem; color: var(--text-muted);">
          <i class="fas fa-filter"></i> Filter Status:
        </span>
        <button class="btn btn-secondary btn-sm filter-badge-btn active" data-status="All">All</button>
        <button class="btn btn-secondary btn-sm filter-badge-btn" data-status="Pending">🟡 Pending</button>
        <button class="btn btn-secondary btn-sm filter-badge-btn" data-status="Approved">🟢 Approved</button>
        <button class="btn btn-secondary btn-sm filter-badge-btn" data-status="Completed">🔵 Completed</button>
        <button class="btn btn-secondary btn-sm filter-badge-btn" data-status="Rejected">🔴 Rejected</button>
        <button class="btn btn-secondary btn-sm filter-badge-btn" data-status="Cancelled">⚪ Cancelled</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Date & Time</th>
              <th>Patient</th>
              <th>Doctor & Specialty</th>
              <th>Room</th>
              <th>Reason</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="apptsDirectoryTbody">
            <!-- Populated dynamically via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentFilterStatus = 'All';

    document.addEventListener('DOMContentLoaded', () => {
      const user = AuthModule.enforceGuard();
      if (!user) return;

      renderAppointmentsTable(user);

      // Filter Buttons Event Delegation
      document.querySelectorAll('.filter-badge-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.filter-badge-btn').forEach(b => b.classList.remove('active', 'btn-primary'));
          e.target.classList.add('active');
          currentFilterStatus = e.target.getAttribute('data-status');
          renderAppointmentsTable(user);
        });
      });
    });

    function renderAppointmentsTable(user) {
      const allAppts = DataStore.getAppointments();

      // Scoped by role
      let userAppts = [];
      if (user.role === 'doctor') {
        const doctors = DataStore.getDoctors();
        const doc = doctors.find(d => d.email.toLowerCase() === user.email.toLowerCase()) || { id: user.id };
        userAppts = allAppts.filter(a => Number(a.doctorId) === Number(doc.id) || a.doctorName === user.name);
      } else {
        userAppts = allAppts.filter(a => Number(a.patientId) === Number(user.id) || a.patientEmail === user.email);
      }

      // Filter by status if not 'All'
      if (currentFilterStatus !== 'All') {
        userAppts = userAppts.filter(a => a.status === currentFilterStatus);
      }

      // Sort by date descending
      userAppts.sort((a, b) => new Date(b.date + 'T' + b.startTime) - new Date(a.date + 'T' + a.startTime));

      const tbody = document.getElementById('apptsDirectoryTbody');

      if (userAppts.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7">
              <div class="empty-state">
                <i class="fas fa-folder-open empty-icon"></i>
                <p>No appointments match the selected status criteria.</p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = userAppts.map(a => `
        <tr>
          <td><code style="font-weight: 700; color: var(--primary);">#${a.id}</code></td>
          <td>
            <strong>${a.date}</strong>
            <div style="font-size: 0.8rem; color: var(--text-muted);">${SchedulerEngine.format12Hour(a.startTime)} - ${SchedulerEngine.format12Hour(a.endTime)}</div>
          </td>
          <td>
            <strong>${a.patientName}</strong>
            <div style="font-size: 0.78rem; color: var(--text-muted);">${a.patientEmail}</div>
          </td>
          <td>
            <strong>${a.doctorName}</strong>
            <div style="font-size: 0.78rem; color: var(--primary);">${a.specialty}</div>
          </td>
          <td><span style="font-size: 0.85rem; background: var(--bg-card-subtle); padding: 0.2rem 0.6rem; border-radius: 4px;">${a.roomNumber}</span></td>
          <td>${a.reason}</td>
          <td><span class="status-badge ${a.status}">${a.status}</span></td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
